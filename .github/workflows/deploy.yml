# GitHub Pages Deployment Workflow for Static Site
# Repository: https://github.com/iforistiak
# Portfolio: https://istiakislam.pro.bd

name: Deploy static content to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static assets
        run: |
          # Ensure assets are reachable via both /assets and /public/assets paths on GitHub Pages
          if [ -d "public/assets" ] && [ ! -d "assets" ]; then
            cp -r public/assets ./assets
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
